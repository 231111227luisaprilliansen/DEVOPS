name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # CI: pasang dependensi, cek syntax, jalankan server dengan MySQL lalu uji API
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - name: Impor skema database
        run: mysql -h127.0.0.1 -uroot -proot < database.sql
      - name: Jalankan server
        run: |
          node server.js > server.log 2>&1 &
          for i in $(seq 1 20); do curl -s localhost:3000/api/me && break; sleep 1; done
        env:
          PORT: 3000
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: kanban_board
          JWT_SECRET: rahasia-untuk-ci-1234567890
      - run: npm test
      - name: Log server (jika gagal)
        if: failure()
        run: cat server.log

  # CD: build image backend & frontend lalu kirim ke GitHub Container Registry (hanya di branch main)
  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            file: Dockerfile
          - name: frontend
            file: frontend.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
